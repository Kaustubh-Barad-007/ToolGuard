name: ToolGuard CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Build, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Typecheck Packages
        run: pnpm typecheck

      - name: Run Vitest Suite
        run: pnpm test

      - name: Build Monorepo Packages & Apps
        run: pnpm build

      - name: ToolGuard Baseline Verification Gate
        run: |
          pnpm --filter @toolguard/cli dev scan || true
